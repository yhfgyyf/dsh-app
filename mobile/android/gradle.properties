# JVM / Gradle
# Do NOT set org.gradle.java.home here: a machine-specific path breaks CI.
# Gradle auto-detects the JDK from JAVA_HOME (set by actions/setup-java on CI
# and by your local environment).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
