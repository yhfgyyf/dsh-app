name: Verify Windows RC1 plugin packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: npm
      - name: Prepare verified native addon toolchain
        shell: pwsh
        run: ./scripts/prepare-windows-node-gyp.ps1
      - name: Install frontend and relay dependencies
        env:
          npm_config_build_from_source: 'true'
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix services/relay --foreground-scripts --no-audit --no-fund
      - name: Prepare the same RC1 runtime and production frontend
        run: |
          npm run setup:runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Reconstruct and verify the portable Univer package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .test-data/rc1-plugins | Out-Null
          gh release download v0.1.45 --repo yhfgyyf/dsh-app --pattern dsh-univer-office-0.3.5-universal.2.tgz --dir .test-data/rc1-plugins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-univer-universal.mjs --archive .test-data/rc1-plugins/dsh-univer-office-0.3.5-universal.2.tgz --out .test-data/rc1-plugins/delivered
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/compatibility/rc1/prepare.mjs
      - name: Run delivered P2P 0.3.4 with the actual Host and relay
        run: node services/relay/node_modules/tsx/dist/cli.mjs scripts/test-collaboration.ts
      - name: Run delivered Side 0.1.8 native lifecycle and references
        run: |
          $env:DSH_SIDE_CHAT_APP_ROOT = (Get-Location).Path
          node tests/compatibility/rc1/side/scripts/test-app.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DSH_DESKTOP_CONTENT_TOOLS_MODULE = Join-Path (Get-Location).Path 'tests/native-quote-actions.cjs'
          node tests/compatibility/rc1/side/scripts/test-app.mjs --content-tools
      - name: Install delivered Univer through Plugin Manager and execute native tools
        run: |
          $env:DSH_TEST_REPORTS = '.test-data/rc1-plugins/univer-upgrade'
          node scripts/test-univer-plugin-upgrade.mjs .test-data/rc1-plugins/delivered/dsh-univer-office-0.3.5-universal.3.tgz .test-data/rc1-plugins/univer-original/package .test-data/rc1-plugins/univer/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/compatibility/rc1/test-univer-host.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-univer-universal.mjs .test-data/rc1-plugins/univer/package tests/compatibility/rc1/univer-provenance.json .test-data/rc1-plugins/univer-compatibility
      - name: Run the delivered Univer native client
        run: |
          $env:DSH_TEST_UNIVER_PACKAGE = Join-Path (Get-Location).Path '.test-data/rc1-plugins/univer/package'
          $env:DSH_TEST_UNIVER_PROVENANCE = Join-Path (Get-Location).Path 'tests/compatibility/rc1/univer-provenance.json'
          npx --no-install electron tests/univer-client.cjs
      - name: Collect plugin acceptance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-rc1-plugin-compat-windows
          path: |
            .test-data/rc1-plugins/prepared.json
            .test-data/rc1-plugins/delivered/universal-provenance.json
            .test-data/rc1-plugins/univer-upgrade/plugin-upgrade-report.json
            .test-data/rc1-plugins/univer-host/plugin-host-report.json
            .test-data/rc1-plugins/univer-compatibility/universal-compatibility.json
            .test-data/univer-client-upgrade/report.json
            .test-data/univer-client-upgrade/*/*.png
            .test-data/collaboration-*/report.json
            .test-data/collaboration-*/host.log
            tests/compatibility/rc1/side/.test-data/latest-desktop.json
            tests/compatibility/rc1/side/.test-data/latest-content-tools.json
            tests/compatibility/rc1/side/.test-data/*/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
