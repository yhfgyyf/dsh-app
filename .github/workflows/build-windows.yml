name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      runtimeSource:
        description: Runtime source (use the verified release for updater-only fixes)
        type: choice
        options: [registry, v0.1.5]
        default: registry

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build pinned runtime and apply verified patch
        if: inputs.runtimeSource != 'v0.1.5'
        run: npm run setup:runtime
      - name: Restore the verified v0.1.5 Windows runtime
        if: inputs.runtimeSource == 'v0.1.5'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'DSH-Desktop-0.1.5-Windows-x64-Setup.exe'
          $donor = Join-Path $env:RUNNER_TEMP 'DSH Runtime Source'
          Invoke-WebRequest -Uri 'https://github.com/yhfgyyf/dsh-app/releases/download/v0.1.5/DSH-Desktop-0.1.5-Windows-x64-Setup.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '098ad90e145097d351d843995a458a422ce7f3f0139a51c245d4144e7b1fcce7') { throw 'Runtime source installer checksum mismatch' }
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $donor + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Runtime source installation failed' }
          Copy-Item (Join-Path $donor 'resources/runtime') '.runtime' -Recurse
          node --input-type=module -e "import {runtimeManifest} from './scripts/runtime-manifest.ts'; const m = await runtimeManifest('.runtime'); if (m.fileCount !== 26256 || m.sha256 !== '2c4d11c050b720fe5d24224166c49da18a70045a2a46b8b06e9ed0127a7872ea') throw Error('Runtime source contents differ'); console.log('Verified all', m.fileCount, 'runtime files');"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime source verification failed' }
          npm exec -- node scripts/prepare-release-runtime-tests.ts
          if ($LASTEXITCODE -ne 0) { throw 'Runtime test fixture preparation failed' }
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Shared model settings
        run: npm run test:model-settings
      - name: Web, TUI and App ownership
        run: npm run test:three-surfaces
      - name: Native Electron lifecycle
        run: npm run test:native
      - name: Computer use approval and image transport
        timeout-minutes: 4
        run: npm run test:computer-tools
      - name: Computer switch and audit dock UI
        timeout-minutes: 3
        run: npm run test:computer-settings
      - name: Native computer input and screenshot (three consecutive runs)
        timeout-minutes: 4
        run: |
          1..3 | ForEach-Object {
            npm run test:computer-native
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native updater
        timeout-minutes: 3
        run: npm run test:updates
      - name: Update download through a proxy
        timeout-minutes: 5
        run: npm run test:update-network
      - name: Native file previews
        timeout-minutes: 3
        run: npm run test:artifact-links
      - name: Native sidebar browser
        timeout-minutes: 3
        run: npm run test:sidebar-browser
      - name: Install pinned Inno Setup with long-path support
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup checksum mismatch' }
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $inno + '"')) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed: $($setup.ExitCode)" }
          "ISCC_PATH=$(Join-Path $inno 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create Windows installer
        run: node scripts/package-windows.ts
      - name: Install, launch, close and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Collect verified installer and reports
        run: node scripts/collect-windows-artifact.ts
      - name: Preserve installation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-app-windows-diagnostics
          path: |
            .test-data/installer-*/install.log
            .test-data/installer-*/updates/report.json
            .test-data/installer-*/updates/failure.txt
            .test-data/installer-*/updates/old-app.log
            .test-data/installer-*/updates/before-install.json
            .test-data/installer-*/desktop-state/updates/install-result.json
            .test-data/installer-*/desktop-state/updates/inno-update.log
            .test-data/installer-*/desktop-state/updates/download-*/install.log
            .test-data/installer-*/desktop-state/updates/download-*/install.json
            .test-data/computer-native/**
            .test-data/computer-*-latest.json
            .test-data/computer-tools-*/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-app-windows-x64
          path: release/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
