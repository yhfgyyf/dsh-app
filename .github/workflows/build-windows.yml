name: Package Windows self-test installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build pinned runtime and apply verified patch
        run: npm run setup:runtime
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Bundled runtime discovery, libraries and virtual environment
        timeout-minutes: 3
        run: npm run test:workspace-dependencies
      - name: Preset restoration and Auto/Audit conversations
        run: |
          npm run test:audit-switch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:auto-conversation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Inno Setup with long-path support
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup checksum mismatch' }
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $inno + '"')) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed: $($setup.ExitCode)" }
          "ISCC_PATH=$(Join-Path $inno 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create Windows installer
        run: node scripts/package-windows.ts
      - name: Verify packaged Python and bundled libraries
        shell: pwsh
        run: |
          $artifact = Get-Content release/latest-windows.json | ConvertFrom-Json
          $env:DSH_TEST_DESKTOP_RUNTIME = Join-Path $artifact.app 'resources/runtime'
          npm run test:workspace-dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, launch, update, close and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Collect self-test installer and packaging evidence
        shell: pwsh
        run: |
          $artifact = Get-Content release/latest-windows.json -Raw | ConvertFrom-Json
          $output = New-Item -ItemType Directory -Path release/upload -Force
          Copy-Item $artifact.installer $output
          Copy-Item (Join-Path (Split-Path $artifact.installer) 'runtime-manifest.json') (Join-Path $output 'runtime-manifest-windows-x64.json')
          Copy-Item .test-data/windows-installer-report.json $output
          Copy-Item .test-data/workspace-dependencies-latest.json (Join-Path $output 'windows-workspace-dependencies-report.json')
          Copy-Item examples/office-smoke.py $output
          Copy-Item examples/README.md (Join-Path $output 'Office-library-test-README.md')
          $artifact.PSObject.Properties.Remove('app')
          $artifact.installer = Split-Path $artifact.installer -Leaf
          $artifact | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $output 'windows-artifact.json') -Encoding utf8
          ($artifact.sha256 + '  ' + $artifact.installer) | Set-Content (Join-Path $output 'SHA256SUMS-windows.txt') -Encoding utf8
          @{
            purpose = 'Manual user testing; not a full UI acceptance pass'
            checks = @('typecheck', 'unit tests', 'production build', 'runtime hashes', 'installer lifecycle', 'packaged Python/Office round trips', 'venv and pip', 'six-mode runtime tool discovery', 'preset restoration', 'Auto/Audit conversations')
            fullUiSuite = 'not rerun: this build reuses the previous installer self-test workflow; targeted new runtime and preset checks are required'
            fullUiRun = 'https://github.com/yhfgyyf/dsh-app/actions/runs/36007061516'
            sourceCommit = $env:GITHUB_SHA
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $output 'validation-scope.json') -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-app-windows-x64
          path: release/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
