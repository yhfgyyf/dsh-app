name: Verify Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Validate Windows lifecycle test syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Recover from a denied cached Windows port
        timeout-minutes: 1
        shell: pwsh
        run: ./scripts/test-windows-port.ps1
      - name: Prepare verified native addon toolchain
        timeout-minutes: 6
        shell: pwsh
        run: ./scripts/prepare-windows-node-gyp.ps1
      - name: Install frontend dependencies
        timeout-minutes: 8
        run: npm ci --no-audit --no-fund
      - name: Build pinned runtime
        run: npm run setup:runtime
      - name: Typecheck and build production files
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Native task notifications and numeric overlays
        timeout-minutes: 3
        run: npm run test:task-notifications
      - name: Install pinned Inno Setup with long-path support
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup checksum mismatch' }
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $inno + '"')) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed: $($setup.ExitCode)" }
          "ISCC_PATH=$(Join-Path $inno 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create Windows installer
        run: node scripts/package-windows.ts
      - name: Retain exact build for package diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-app-windows-unverified-package
          path: |
            release/*/DSH-Desktop-*-Windows-x64-Setup.exe
            release/*/artifact.json
            release/*/runtime-manifest.json
          compression-level: 0
          retention-days: 3
      - name: Verify packaged runtime with exit diagnostics
        timeout-minutes: 3
        shell: pwsh
        run: |
          $artifact = Get-Content release/latest-windows.json | ConvertFrom-Json
          $env:DSH_TEST_DESKTOP_RUNTIME = Join-Path $artifact.app 'resources/runtime'
          node --trace-exit --trace-uncaught scripts/test-workspace-dependencies.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, update, launch and uninstall
        timeout-minutes: 6
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Collect verified package
        run: node scripts/collect-windows-package.ts
      - name: Package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-app-windows-package-diagnostics
          path: |
            .test-data/workspace-dependencies-failure.json
            .test-data/workspace-dependencies-latest.json
            .test-data/task-notifications-latest.json
            .test-data/installer-*/install.log
            .test-data/installer-*/updates/report.json
            .test-data/installer-*/updates/failure.txt
            .test-data/installer-*/desktop-state/updates/install-result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-app-windows-package-verified
          path: release/upload-installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
