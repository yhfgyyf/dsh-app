- insert:
    - id: auto-preset-router-bundle
      name: dsh-auto-preset-router
    - id: audit-bundle
      name: dsh-audit-mode
    - id: progressive-tools
      name: dsh-progressive-tools
    - id: desktop-computer-use
      name: './computer-use.ts'
